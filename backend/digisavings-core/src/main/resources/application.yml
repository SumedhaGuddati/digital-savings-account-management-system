spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/backend_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  logging:
    level:
      org.springframework.transaction: DEBUG